<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Hands Together</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="page-wrapper">
    <nav class="top-nav">
        <a href="{{ url_for('dashboard') }}" class="nav-brand">Hands Together</a>
        <div class="nav-links">
            <a href="{{ url_for('dashboard') }}" class="active">Dashboard</a>
            <a href="{{ url_for('donations') }}">Browse Donations</a>
            <a href="{{ url_for('donate') }}">Donate</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </div>
    </nav>

    <div class="dash-container">
        <div class="dash-header">
            <h1>Welcome, {{ user.name }}!</h1>
            <p>You are logged in as {{ user.email }}</p>
        </div>

        <div class="dash-stats">
            <div class="dash-stat">
                <h3>{{ my_donations }}</h3>
                <p>Your Donations</p>
            </div>
            <div class="dash-stat">
                <h3>{{ total_donations }}</h3>
                <p>Total Donations Available</p>
            </div>
        </div>

        <div class="dash-actions">
            <h2>Quick Actions</h2>
            <div class="action-buttons">
                <a href="{{ url_for('donate') }}" class="btn-primary">+ Donate an Item</a>
                <a href="{{ url_for('donations') }}" class="btn-outline">Browse All Donations</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
